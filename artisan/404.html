  <script>document.documentElement.setAttribute('data-theme','light');</script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #1a73e8;
      --accent-hover: #1765cc;
      --text: #131314;
      --text-secondary: #5f6368;
      --text-tertiary: #80868b;
      --surface: #ffffff;
      --surface-dim: #f4f7fe;
      --border: #e3e6ea;
    }

    [data-theme="dark"] {
      --accent: #4285f4;
      --accent-hover: #5e97f6;
      --text: #e8eaed;
      --text-secondary: #9aa0a6;
      --text-tertiary: #7c8085;
      --surface: #131314;
      --surface-dim: #0d0d0e;
      --border: #37383b;
    }

    body {
      font-family: 'Google Sans Text', 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--surface);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 480px;
    }

    .error-code {
      font-size: clamp(80px, 15vw, 120px);
      font-weight: 600;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -4px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 48px;
      transition: background 0.2s, color 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface-dim);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      color: var(--text);
      background: var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <div class="actions">
      <a href="/" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Go home
      </a>
      <a href="/profile" class="btn-secondary">View profile</a>
    </div>
  </div>

</body>
